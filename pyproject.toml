[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turkuaz-clickflow"
version = "0.1.0"
description = "Desktop automation app for safe, controlled click workflows."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Turkuaz" }
]
dependencies = [
  "PySide6>=6.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]
package = [
  "pyinstaller>=6.0"
]

[project.scripts]
turkuaz-clickflow = "turkuaz_clickflow.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
